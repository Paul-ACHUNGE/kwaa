<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Connexion · Administration KWAA</title>
  <link rel="icon" href="assets/logo/KWAA_icone.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>

<body data-page="login">
  <header class="adm-top">
    <div class="wrap adm-bar">
      <a class="brand" href="index.html"><svg class="logo-icon" viewBox="0 0 3140 3376" aria-hidden="true">
          <use href="assets/logo/sprite.svg#kwaa-icon" />
        </svg><span>KWA WOTE<small>ADMINISTRATION</small></span></a>
    </div>
  </header>
  <main class="wrap adm adm-narrow">
    <h1>Connexion</h1>
    <p>L'accès est réservé aux architectes invités par l'administrateur.</p>
    <form id="login" class="form">
      <label>Courriel<input type="email" name="email" required autocomplete="username"></label>
      <label>Mot de passe<input type="password" name="pw" required autocomplete="current-password"></label>
      <p id="msg" role="status"></p>
      <button class="btn solid">Se connecter</button>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>

</html>
