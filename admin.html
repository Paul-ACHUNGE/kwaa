<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Espace administration · KWAA</title>
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/admin.css">
</head><body><main class="wrap adm">
<h1>Espace administration</h1>
<p id="msg" role="status"></p>

<form id="login" class="form">
  <label>Courriel<input type="email" name="email" required autocomplete="username"></label>
  <label>Mot de passe<input type="password" name="pw" required autocomplete="current-password"></label>
  <button class="btn solid">Se connecter</button>
  <p>L'accès est sur invitation de l'administrateur.</p>
</form>

<div id="app" hidden>
  <p><span id="who"></span> <button id="out" class="btn">Déconnexion</button></p>
  <h2>Nouveau projet</h2>
  <form id="new" class="form">
    <label>Titre<input name="title" required maxlength="120"></label>
    <label>Catégorie<select name="category"><option value="res">Résidentiel</option><option value="urb">Urbanisme</option><option value="des">Design intérieur</option><option value="ins">Institutions</option></select></label>
    <label>Statut<select name="work_status"><option value="realise">Réalisé</option><option value="chantier">En chantier</option><option value="etude">Projet d'étude / concours</option><option value="visuel">Visualisation</option></select></label>
    <label>Lieu<input name="location"></label>
    <label>Défi<textarea name="challenge" rows="3"></textarea></label>
    <label>Solution<textarea name="solution" rows="3"></textarea></label>
    <label>Surface<input name="surface" placeholder="ex. 180 m²"></label>
    <label>Délai<input name="delay" placeholder="ex. 8 mois"></label>
    <label>Photo ou rendu (réduit automatiquement)<input type="file" name="img" accept="image/*"></label>
    <button class="btn solid" id="send">Enregistrer</button>
  </form>
  <h2 id="lt">Projets</h2>
  <ul id="list" class="adm-list"></ul>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script><script src="js/admin.js"></script>
</body></html>
